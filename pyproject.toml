[project]
name = "myapp"
version = "0.1.0"
description = "FastAPI modular monolith with Celery and agentic workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "openai>=1.54",
    # Prompt-size estimation before a call. Actual spend is read from the API's
    # own `usage` field; this is only for budgeting a corpus in advance.
    "tiktoken>=0.8",
    "httpx>=0.28",
    "google-auth[requests]>=2.35",
    "python-jose[cryptography]>=3.3",
    # Fernet, for the OAuth tokens in `google_connections`. Direct rather than
    # inherited through python-jose's extra: token-at-rest encryption should not
    # break because an unrelated jose bump reshuffles its optional deps.
    "cryptography>=43",
    "passlib[bcrypt]>=1.7",
    "structlog>=24.4",
    # Text extraction for draft instruction/knowledge uploads. Only the text is
    # kept, so these run once per upload and never at drafting time.
    "pypdf>=5.1",
    "python-docx>=1.1",
    # Multipart form parsing for those uploads — FastAPI needs it for UploadFile.
    "python-multipart>=0.0.18",
    "razorpay>=1.4",
    # S3/R2 for meeting media we hold ourselves. Only presigning and object
    # lifecycle — the bytes go browser-to-bucket and never through the API.
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
# src/ is a bare import root (packages: core, domains, agents, api, models +
# loose modules main/celery_app/worker/beat_schedule), not an installable
# distribution — manage deps only and put src on PYTHONPATH to run.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The session-scoped `engine` fixture in tests/conftest.py opens asyncpg
# connections that must not cross event loops, so fixtures and tests share one
# session-scoped loop instead of pytest-asyncio's default per-test loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
