name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inboxpilot
          POSTGRES_PASSWORD: inboxpilot
          POSTGRES_DB: inboxpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inboxpilot -d inboxpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://inboxpilot:inboxpilot@localhost:5432/inboxpilot_test
      JWT_SECRET: ci-only-not-a-production-secret
      GOOGLE_TOKEN_ENCRYPTION_KEYS: ""
      OPENAI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --locked
      - name: Check formatting
        run: uv run ruff format --check src tests
      - name: Lint
        run: uv run ruff check src tests
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
