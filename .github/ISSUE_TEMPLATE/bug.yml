name: Bug report
description: Report a reproducible InboxPilot defect using synthetic or sanitized data.
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not post credentials, `.env`, OAuth tokens, real email bodies, customer data, or signed URLs.
        Report security vulnerabilities through the private advisory link instead.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible steps using synthetic data.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.x.y or commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - Local Python
        - AWS reference deployment
        - Render
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove addresses, subjects, bodies, IDs, secrets, tokens, and private URLs.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets and personal/mailbox data.
          required: true
        - label: This is not a security vulnerability.
          required: true
