name: Feature request
description: Propose a focused improvement to InboxPilot.
title: "feat: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What recurring problem should InboxPilot solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior rather than an implementation.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Mailbox, privacy, and safety impact
      description: Note new scopes, external writes, model data, destructive actions, or retention.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
